<div class="border border-stone-200 bg-stone-50 p-6">
  <h2 class="border-b border-stone-200 pb-4 text-xl font-semibold tracking-tight text-stone-900">
    Add All To Cart
  </h2>

  <div class="mt-4 space-y-2.5 text-sm text-stone-600">
    <div class="flex items-center justify-between">
      <span>Saved Items</span>
      <span class="font-medium text-stone-900">{{ items().length }}</span>
    </div>
    <div class="flex items-center justify-between">
      <span>In-Stock Items</span>
      <span class="font-semibold text-emerald-700">{{ availableItems.length }}</span>
    </div>
    <div class="flex items-center justify-between border-t border-stone-200 pt-2.5 text-base font-semibold text-stone-900">
      <span>In-Stock Total</span>
      <span class="font-bold text-[#8a6a3e]">R {{ availableSubtotal.toFixed(2) }}</span>
    </div>
  </div>

  @if (lastAdded(); as item) {
    <div class="mt-4 flex items-center gap-2 border border-[#c8a97e] bg-white px-3.5 py-2.5 text-xs font-medium text-stone-900">
      <span class="h-2 w-2 shrink-0 rounded-full bg-[#c8a97e]"></span>
      <span>Added <span class="font-semibold text-[#8a6a3e]">{{ item.name }}</span> to cart.</span>
    </div>
  }

  <button
    type="button"
    (click)="moveAllToCart.emit()"
    [disabled]="availableItems.length === 0"
    class="mt-5 w-full cursor-pointer bg-black px-4 py-3 text-xs font-semibold uppercase tracking-[0.12em] text-white transition duration-200 hover:bg-[#8a6a3e] disabled:cursor-not-allowed disabled:bg-stone-400"
  >
    Add All To Cart
  </button>
</div>
