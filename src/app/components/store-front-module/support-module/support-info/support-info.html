<div class="flex flex-col gap-6">
  <!-- Contact Details Card -->
  <div class="border border-stone-200 bg-white p-6 sm:p-8">
    <span class="block text-xs font-semibold uppercase tracking-[0.16em] text-[#a68559]">
      Get In Touch
    </span>
    <h2 class="mt-2 text-xl font-bold uppercase tracking-tight text-stone-900">
      Support Information
    </h2>

    <ul class="mt-6 space-y-5 text-sm text-stone-700">
      <!-- Email -->
      <li class="flex items-start gap-3.5">
        <span
          class="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center border border-stone-200 bg-stone-50 text-[#a68559]"
          aria-hidden="true"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"
            />
          </svg>
        </span>
        <div class="min-w-0">
          <span class="block text-[11px] font-semibold uppercase tracking-[0.12em] text-stone-500">
            Email
          </span>
          <a
            [href]="'mailto:' + email"
            class="mt-0.5 inline-block break-all font-medium text-stone-900 transition-colors hover:text-[#a68559]"
          >
            {{ email }}
          </a>
        </div>
      </li>

      <!-- Phone -->
      <li class="flex items-start gap-3.5">
        <span
          class="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center border border-stone-200 bg-stone-50 text-[#a68559]"
          aria-hidden="true"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z"
            />
          </svg>
        </span>
        <div class="min-w-0">
          <span class="block text-[11px] font-semibold uppercase tracking-[0.12em] text-stone-500">
            Phone
          </span>
          <a
            [href]="phoneHref"
            class="mt-0.5 inline-block font-medium text-stone-900 transition-colors hover:text-[#a68559]"
          >
            {{ phone }}
          </a>
        </div>
      </li>

      <!-- Address -->
      <li class="flex items-start gap-3.5">
        <span
          class="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center border border-stone-200 bg-stone-50 text-[#a68559]"
          aria-hidden="true"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"
            />
          </svg>
        </span>
        <div class="min-w-0">
          <span class="block text-[11px] font-semibold uppercase tracking-[0.12em] text-stone-500">
            Address
          </span>
          <p class="mt-0.5 font-medium text-stone-900">
            {{ address }}
          </p>
        </div>
      </li>
    </ul>
  </div>

  <!-- Map Embed Below Support Info -->
  <div class="overflow-hidden border border-stone-200 bg-white">
    <iframe
      [src]="mapUrl"
      title="Urban Nomad Location Map"
      class="block h-[300px] w-full border-0 sm:h-[340px]"
      width="600"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>
</div>
