<div class="min-h-[450px] border-x-0 border-y border-stone-200 bg-white px-5 py-7 md:border md:p-10">
  <h2 class="mb-6 border-b border-stone-200 pb-4 text-xl font-semibold uppercase tracking-[0.06em] text-black">
    Logout
  </h2>
  <p class="mb-8 text-sm leading-[1.7] text-stone-600">
    End your current Urban Nomad session on this device. You can sign back in anytime.
  </p>

  <div class="flex flex-col items-start gap-4 border border-stone-200 bg-stone-50/60 p-6">
    <div>
      <h3 class="text-sm font-semibold uppercase tracking-[0.05em] text-stone-900">
        Sign Out of Session
      </h3>
      <p class="mt-1 text-sm text-stone-600">
        Clicking Logout will immediately terminate your active authentication session.
      </p>
    </div>

    <button
      type="button"
      [disabled]="isLoggingOut()"
      (click)="onLogout()"
      class="cursor-pointer rounded border border-red-600 bg-red-600 px-6 py-2.5 text-xs font-semibold uppercase tracking-[0.08em] text-white transition-colors duration-200 hover:bg-red-700 disabled:cursor-not-allowed disabled:bg-red-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#a68559]"
    >
      {{ isLoggingOut() ? 'Logging out…' : 'Logout' }}
    </button>

    @if (errorMessage()) {
      <p class="mt-1 text-[13px] font-medium text-red-600">{{ errorMessage() }}</p>
    }
  </div>
</div>
