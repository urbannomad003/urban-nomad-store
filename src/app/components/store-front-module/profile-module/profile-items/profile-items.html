<nav aria-label="Account sections" class="rounded-lg border border-stone-200 bg-white p-2 shadow-[0_4px_12px_rgba(0,0,0,0.03)]">
  <ul class="flex flex-col gap-1">
    @for (item of items; track item.id) {
      <li>
        <button
          type="button"
          (click)="onSelect(item.id)"
          [attr.aria-current]="activeSection() === item.id ? 'page' : null"
          [class]="
            activeSection() === item.id
              ? 'flex w-full cursor-pointer items-center justify-between rounded-md bg-[#c8a97e]/15 px-4 py-2.5 text-left text-sm font-semibold text-[#a68559] transition-colors duration-200'
              : 'flex w-full cursor-pointer items-center justify-between rounded-md px-4 py-2.5 text-left text-sm font-medium text-stone-700 transition-colors duration-200 hover:bg-stone-100 hover:text-stone-900'
          "
        >
          <span>{{ item.label }}</span>
        </button>
      </li>
    }
  </ul>
</nav>
