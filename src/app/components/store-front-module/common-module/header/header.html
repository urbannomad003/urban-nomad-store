<!-- No "fixed" here: stickiness is handled by <app-header class="sticky top-0 z-40 block"> in app.html -->
<header class="bg-white shadow-sm">
  <div class="hidden h-10 bg-white lg:block">
    <div class="mx-auto h-full max-w-[1500px] px-4 sm:px-6 lg:px-8">
      <div class="flex h-full items-center justify-between gap-4 border-b border-stone-300">
        <!-- Text links -->
        <nav class="min-w-0 flex-1 overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden" aria-label="Secondary">
          <ul class="flex items-center gap-4 whitespace-nowrap sm:gap-5">
            @for (link of links; track link.path) {
              <li>
                <a
                  [routerLink]="link.path"
                  [routerLinkActiveOptions]="{ exact: link.path === '/' }"
                  routerLinkActive="after:scale-x-100"
                  class="relative block py-2 text-[13px] font-semibold uppercase tracking-normal text-stone-900
                         after:absolute after:bottom-1 after:left-0 after:h-px after:w-full after:origin-left after:scale-x-0
                         after:bg-[#c8a97e] after:transition-transform after:duration-300 after:ease-out
                         hover:after:scale-x-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#a68559]"
                >
                  {{ link.label }}
                </a>
              </li>
            }
          </ul>
        </nav>

        <!-- Social icons -->
        <ul class="flex shrink-0 items-center gap-3 sm:gap-4">
          <li>
            <a
              href="https://www.instagram.com/bokabalisa/"
              target="_blank"
              rel="noopener"
              aria-label="Instagram"
              class="block rounded p-1 text-stone-900 transition duration-200 hover:-translate-y-0.5 hover:opacity-60
                     focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#a68559]"
            >
              <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5" />
                <circle cx="12" cy="12" r="4" />
                <circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none" />
              </svg>
            </a>
          </li>
          <li>
            <a
              href="https://www.tiktok.com/@lisabokaba4"
              target="_blank"
              rel="noopener"
              aria-label="TikTok"
              class="block rounded p-1 text-stone-900 transition duration-200 hover:-translate-y-0.5 hover:opacity-60
                     focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#a68559]"
            >
              <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z" />
              </svg>
            </a>
          </li>
          <li>
            <a
              href="https://www.facebook.com/lisa.bokaba/"
              target="_blank"
              rel="noopener"
              aria-label="Facebook"
              class="block rounded p-1 text-stone-900 transition duration-200 hover:-translate-y-0.5 hover:opacity-60
                     focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#a68559]"
            >
              <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M14.6 22v-8.6h2.9l.4-3.4h-3.3V7.8c0-1 .3-1.7 1.7-1.7h1.8V3.1c-.3 0-1.4-.1-2.7-.1-2.7 0-4.5 1.6-4.5 4.6V10H8v3.4h2.9V22h3.7z" />
              </svg>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <app-navbar [bagCount]="bagCount" [alertCount]="alertCount" />
</header>
