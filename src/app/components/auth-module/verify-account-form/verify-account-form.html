<div class="mx-auto my-8 flex w-full justify-center px-4 sm:my-12">
  <div
    class="relative box-border w-full max-w-[560px] rounded-[6px] border border-[#e2e8f0] bg-white p-6 shadow-[0_4px_12px_rgba(0,0,0,0.03)] sm:p-10"
  >
    @if (isLoading()) {
      <div
        class="absolute inset-0 z-20 flex items-center justify-center rounded-[6px] bg-white/85"
        role="status"
        aria-live="polite"
      >
        <div
          class="h-8 w-8 animate-spin rounded-full border-4 border-[#c8a97e] border-r-transparent"
        ></div>
        <span class="sr-only">Loading...</span>
      </div>
    }

    <button
      type="button"
      (click)="goBackToHome()"
      aria-label="Close"
      class="absolute top-6 right-6 z-15 cursor-pointer border-0 bg-transparent p-0 text-2xl leading-none text-[#adb5bd] transition-colors duration-200 hover:text-[#212529]"
    >
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <div class="mb-6 flex flex-col items-center text-center">
      <img
        src="/logo-transparent-background.png"
        alt="Urban Nomad"
        class="mb-2 h-auto max-w-[160px] object-contain"
      />
      <h4 class="m-0 text-xl font-bold text-[#212529]">Verify Account</h4>
      <p class="mt-1.5 max-w-sm text-[0.875rem] text-[#6c757d]">
        Click the verification link sent to your email address (check spam/junk if needed), then continue below.
      </p>
    </div>

    @if (errorMessage()) {
      <div class="mb-4 flex items-center py-2 text-[0.85rem] font-medium text-[#d93025]" role="alert">
        <svg class="mr-1.5 h-4 w-4 shrink-0" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
            clip-rule="evenodd"
          />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    @if (resentMessage()) {
      <div class="mb-4 flex items-center py-2 text-[0.85rem] font-medium text-[#a68559]" role="status">
        <svg class="mr-1.5 h-4 w-4 shrink-0" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z"
            clip-rule="evenodd"
          />
        </svg>
        <span>{{ resentMessage() }}</span>
      </div>
    }

    <button
      type="button"
      (click)="onCheckVerification()"
      [disabled]="isLoading()"
      class="mb-4 w-full cursor-pointer rounded-full border-0 bg-[#a68559] py-2.5 text-sm font-bold text-white transition-all duration-300 hover:bg-[#c8a97e] disabled:cursor-not-allowed disabled:opacity-60"
    >
      I Have Verified My Email
    </button>

    <div class="mt-3 flex flex-col items-center gap-2 text-center text-[0.875rem] text-[#6c757d]">
      <button
        type="button"
        (click)="onResend()"
        [disabled]="isLoading()"
        class="cursor-pointer border-0 bg-transparent p-0 font-bold text-[#a68559] no-underline hover:underline disabled:cursor-not-allowed disabled:opacity-60"
      >
        Resend verification email
      </button>
      <a
        routerLink="/login"
        class="text-xs text-[#6c757d] no-underline hover:underline"
      >
        Back to Login
      </a>
    </div>
  </div>
</div>
