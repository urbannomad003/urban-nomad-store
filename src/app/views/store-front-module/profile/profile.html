<section class="mx-auto max-w-[1380px] px-4 py-8 sm:px-6 lg:px-8 lg:py-10">
  <div class="mb-8 border-b border-stone-200 pb-4">
    <h1 class="text-2xl font-semibold tracking-tight text-stone-900 sm:text-3xl">My Profile</h1>
    <p class="mt-1 text-sm text-stone-600">Manage your account details, saved addresses, and security settings.</p>
  </div>

  <div class="grid grid-cols-1 gap-8 lg:grid-cols-[18rem_minmax(0,1fr)]">
    <aside aria-label="Profile navigation">
      <app-profile-items
        [activeSection]="activeSection()"
        (sectionSelected)="selectSection($event)"
      />
    </aside>

    <main class="min-w-0 rounded-lg border border-stone-200 bg-white p-6 shadow-[0_4px_12px_rgba(0,0,0,0.03)] sm:p-8">
      @switch (activeSection()) {
        @case ('account-details') {
          <app-account-details />
        }
        @case ('account-management') {
          <app-account-management />
        }
        @case ('address-book') {
          <app-address-book />
        }
        @case ('security') {
          <app-security />
        }
        @case ('logout') {
          <app-logout />
        }
      }
    </main>
  </div>
</section>
